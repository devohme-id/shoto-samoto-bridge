<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="807" viewBox="0 0 1260 807" role="img" aria-labelledby="title desc">
  <title id="title">Wiring fungsional monitor energi Samoto</title>
  <desc id="desc">IHF6200 dan ILS6300 memakai wiring identik. Dua meter PZEM-004T terpisah mengukur masukan PLN dan keluaran inverter. PZEM-017 opsional mengukur input PV DC setelah verifikasi Voc. ESP32 mengirim data meter ke MQTT. Bridge Shoto memberikan data baterai secara independen.</desc>
  <defs>
    <marker id="arrow-power" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9a431a"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#155d78"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172d39 }
      .head { font-size: 32px; font-weight: 700; fill: #fff }
      .subhead { font-size: 17px; fill: #d7e7ed }
      .label { font-size: 20px; font-weight: 700 }
      .detail { font-size: 15px; fill: #354c58 }
      .path-label { font-size: 14px; fill: #155d78 }
      .box { fill: #fff; stroke: #9cabb2; stroke-width: 1.5 }
      .meter { fill: #fff9f2; stroke: #b2683a; stroke-width: 1.5 }
      .device { fill: #e9f4fa; stroke: #247290; stroke-width: 1.5 }
      .power { fill: none; stroke: #9a431a; stroke-width: 3; marker-end: url(#arrow-power) }
      .data { fill: none; stroke: #155d78; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow-data) }
    </style>
  </defs>
  <rect width="1260" height="807" fill="#f3f6f7"/>
  <rect width="1260" height="100" fill="#122f3e"/>
  <text class="head" x="38" y="46">Monitoring energi Samoto dengan PZEM</text>
  <text class="subhead" x="40" y="76">Satu set per inverter · IHF6200 dan ILS6300 memakai wiring yang sama</text>

  <rect class="box" x="38" y="130" width="176" height="76" rx="7"/>
  <text class="label" x="55" y="164">PLN 1 fase</text>
  <text class="detail" x="55" y="188">Jalur AC masuk</text>
  <rect class="box" x="38" y="240" width="176" height="76" rx="7"/>
  <text class="label" x="55" y="274">String PV</text>
  <text class="detail" x="55" y="298">Jalur DC panel</text>

  <rect class="meter" x="257" y="130" width="262" height="76" rx="7"/>
  <text class="label" x="275" y="161">PZEM-004T V3 · PLN</text>
  <text class="detail" x="275" y="185">CT pada fase + referensi AC</text>
  <rect class="meter" x="257" y="240" width="262" height="76" rx="7"/>
  <text class="label" x="275" y="271">PZEM-017 · PV</text>
  <text class="detail" x="275" y="295">Opsional · shunt DC 100 A / 75 mV</text>

  <rect class="box" x="563" y="130" width="221" height="186" rx="7"/>
  <text class="label" x="581" y="175">Inverter Samoto</text>
  <text class="detail" x="581" y="200">AC input dan PV input</text>
  <text class="detail" x="581" y="228">AC output terukur</text>

  <rect class="meter" x="828" y="130" width="261" height="76" rx="7"/>
  <text class="label" x="846" y="161">PZEM-004T V3 · Beban</text>
  <text class="detail" x="846" y="185">CT pada fase + referensi AC</text>
  <rect class="box" x="1121" y="130" width="104" height="76" rx="7"/>
  <text class="label" x="1137" y="174">Beban</text>

  <path class="power" d="M214 168H255"/>
  <path class="power" d="M519 168H561"/>
  <path class="power" d="M214 278H255"/>
  <path class="power" d="M519 278H561"/>
  <path class="power" d="M784 168H826"/>
  <path class="power" d="M1089 168H1119"/>

  <rect class="device" x="270" y="430" width="690" height="173" rx="8"/>
  <text class="label" x="291" y="462">ESP32 Dev Kit khusus monitoring</text>
  <text class="detail" x="291" y="491">PLN · UART1 9600 8N1 · RX GPIO16 / TX GPIO17</text>
  <text class="detail" x="291" y="517">Beban · UART2 9600 8N1 · RX GPIO27 / TX GPIO26</text>
  <text class="detail" x="291" y="543">PV · UART0 remap 9600 8N2 · RX GPIO32 / TX GPIO33 · DE + /RE GPIO23</text>
  <text class="detail" x="291" y="571">Catu USB 5 V yang stabil · log serial USB saat PV dinonaktifkan</text>

  <path class="data" d="M283 206V222H230V406H335V428"/>
  <text class="path-label" x="42" y="346">TTL lewat antarmuka</text>
  <text class="path-label" x="42" y="366">5 V ↔ 3,3 V yang sesuai</text>
  <path class="data" d="M430 316V428"/>
  <text class="path-label" x="447" y="365">RS485 terisolasi · catu 5 V sisi meter</text>
  <path class="data" d="M950 206V384H889V428"/>
  <text class="path-label" x="967" y="343">TTL lewat antarmuka</text>
  <text class="path-label" x="967" y="363">5 V ↔ 3,3 V yang sesuai</text>

  <rect class="box" x="38" y="646" width="291" height="80" rx="7"/>
  <text class="label" x="55" y="679">ESP32 bridge Shoto</text>
  <text class="detail" x="55" y="704">SOC dan arah daya baterai</text>
  <rect class="device" x="480" y="646" width="288" height="80" rx="7"/>
  <text class="label" x="499" y="679">Mosquitto LAN</text>
  <text class="detail" x="499" y="704">Topik meter dan baterai per unit</text>
  <rect class="device" x="933" y="646" width="292" height="80" rx="7"/>
  <text class="label" x="952" y="679">Home Assistant</text>
  <text class="detail" x="952" y="704">Dashboard energi per inverter</text>
  <path class="data" d="M329 688H478"/>
  <path class="data" d="M624 603V644"/>
  <path class="data" d="M768 688H931"/>

  <path d="M38 753H1224" stroke="#c0cbd0"/>
  <text class="detail" x="39" y="781">Diagram menunjukkan titik ukur dan jalur data. Pemasangan terminal AC dan PV DC mengikuti manual meter dan desain panel teknisi.</text>
</svg>
