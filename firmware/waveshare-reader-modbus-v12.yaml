# Shoto BMS Modbus V1.2 Reader (Resmi PDF V1.2_EN-20190110) — Opsi B (Waveshare ESP32-S3-RS485-CAN)
# Alamat default Shoto V1.2: 38 + DIP (DIP 0 = 38 / 0x26, DIP 1 = 39 / 0x27).
# Untuk unit tanpa DIP switch, cek hasil `serial_lab.py autodetect` lalu sesuaikan pack1_id/pack2_id.
substitutions:
  shoto_baud: '9600'
  pack1_id: '38'
  pack2_id: '39'
esphome:
  name: shoto-waveshare-modbus-v12
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
logger:
  baud_rate: 0
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
uart:
  - id: shoto_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    flow_control_pin: GPIO21
    baud_rate: ${shoto_baud}
    data_bits: 8
    parity: NONE
    stop_bits: 1
modbus:
  - id: shoto_bus
    uart_id: shoto_uart
    send_wait_time: 300ms
modbus_controller:
  - id: pack1
    modbus_id: shoto_bus
    address: ${pack1_id}
    update_interval: 5s
    command_throttle: 100ms
  - id: pack2
    modbus_id: shoto_bus
    address: ${pack2_id}
    update_interval: 5s
    command_throttle: 100ms
sensor:
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 Voltage"
    address: 0x0FFF
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 Current (+Charge/-Disch)"
    address: 0x1000
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 1
    filters:
      - lambda: 'return (10000.0f - x) * 0.1f;'
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 SOC"
    address: 0x1007
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 SOH"
    address: 0x1008
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 Voltage"
    address: 0x0FFF
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 Current (+Charge/-Disch)"
    address: 0x1000
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 1
    filters:
      - lambda: 'return (10000.0f - x) * 0.1f;'
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 SOC"
    address: 0x1007
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 SOH"
    address: 0x1008
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
