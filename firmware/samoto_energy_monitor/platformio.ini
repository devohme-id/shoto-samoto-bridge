[platformio]
src_dir = .
default_envs = energy_ihf6200

[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200
upload_speed = 115200
lib_deps = knolleary/PubSubClient @ ^2.8

[env:energy_ihf6200]
build_flags = -DENERGY_SITE_IHF6200

[env:energy_ils6300]
build_flags = -DENERGY_SITE_ILS6300
