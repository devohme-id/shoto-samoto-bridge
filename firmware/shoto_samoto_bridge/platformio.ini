[env:diy_esp32_wroom32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
build_flags =
  -std=gnu++17
  -Wall
  -Wextra

[env:waveshare_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
build_flags =
  -std=gnu++17
  -DBOARD_WAVESHARE_S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wall
  -Wextra
