# LEGACY MANUAL DIRECTION ONLY: not for XY-K485 or auto-direction hardware.
# READ-ONLY monitor; verify the discovered addresses/baud before flashing.
# Samoto cable must remain disconnected; no inverter emulator in this firmware.
substitutions:
  shoto_baud: '9600'
  pack1_id: '1'
  pack2_id: '2'
esphome:
  name: shoto-diy-reader
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  baud_rate: 0
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
uart:
  - id: shoto_uart
    tx_pin: GPIO17
    rx_pin: GPIO16
    flow_control_pin: GPIO25
    baud_rate: ${shoto_baud}
    data_bits: 8
    parity: NONE
    stop_bits: 1
modbus:
  - id: shoto_bus
    uart_id: shoto_uart
    send_wait_time: 300ms
modbus_controller:
  - id: pack1
    modbus_id: shoto_bus
    address: ${pack1_id}
    update_interval: 5s
    command_throttle: 100ms
  # Enable pack2 only after proving it is independently addressed.
  # Remove pack2 and its sensors if only one independent address exists.
  - id: pack2
    modbus_id: shoto_bus
    address: ${pack2_id}
    update_interval: 5s
    command_throttle: 100ms
sensor:
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 Bus voltage"
    id: p1_vbus
    address: 0x0000
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 Internal voltage"
    id: p1_vbat
    address: 0x0001
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 SOC"
    id: p1_soc
    address: 0x1034
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 SOH"
    id: p1_soh
    address: 0x1035
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 Bus current RAW"
    id: p1_ibus_raw
    address: 0x1030
    register_type: read
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 Protection RAW"
    id: p1_protection
    address: 0x103C
    register_type: read
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 Operation RAW"
    id: p1_operation
    address: 0x103D
    register_type: read
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: pack1
    name: "Pack 1 Parallel count candidate"
    id: p1_online
    address: 0x103F
    register_type: read
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 Bus voltage"
    id: p2_vbus
    address: 0x0000
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 Internal voltage"
    id: p2_vbat
    address: 0x0001
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 SOC"
    id: p2_soc
    address: 0x1034
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 SOH"
    id: p2_soh
    address: 0x1035
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 Bus current RAW"
    id: p2_ibus_raw
    address: 0x1030
    register_type: read
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 Protection RAW"
    id: p2_protection
    address: 0x103C
    register_type: read
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 Operation RAW"
    id: p2_operation
    address: 0x103D
    register_type: read
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: pack2
    name: "Pack 2 Parallel count candidate"
    id: p2_online
    address: 0x103F
    register_type: read
    value_type: U_WORD
