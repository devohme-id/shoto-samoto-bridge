<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="960" fill="#f4f7fb"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="106" fill="#0f2740"/>
  <text x="40" y="46" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">A02 — WIRING DUA SHOTO SMART-LI &amp; TERMINATOR (LANGKAH DEMI LANGKAH)</text>
  <text x="40" y="80" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#cbd5e1">Shoto SDA10-48100 / 48150 / 4850 tanpa DIP switch • Gunakan Patch Cord Cat5e/6 • Pastikan daya/beban aman saat merangkai</text>

  <!-- ==================== LEFT: STEP-BY-STEP CASCADE ==================== -->
  <rect x="35" y="128" width="745" height="698" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f2740">URUTAN PEMASANGAN KABEL DATA BATERAI</text>

  <!-- Step 2 Badge -->
  <rect x="60" y="188" width="132" height="30" rx="6" fill="#15803d"/>
  <text x="126" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">LANGKAH 2</text>
  <text x="206" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d">Kabel Utama ke SCM-US48I (A03) atau XY-K485 #1 BAT</text>

  <!-- Shoto #1 Box -->
  <rect x="60" y="232" width="440" height="145" rx="10" fill="#273646" stroke="#0f172a" stroke-width="2"/>
  <text x="82" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">SHOTO SMART-LI #1</text>
  <text x="82" y="286" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">Unit paling dekat ke Bridge / Laptop</text>

  <rect x="82" y="305" width="160" height="54" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="162" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">Port RS485A</text>
  <text x="162" y="347" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Cascade Out ke #2</text>

  <rect x="295" y="305" width="180" height="54" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="385" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#4ade80" text-anchor="middle">Port RS485B</text>
  <text x="385" y="347" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Data Utama (Pin 1 &amp; 2)</text>

  <!-- Wire out of RS485B to Reader -->
  <polyline points="475,332 536,332" fill="none" stroke="#15803d" stroke-width="5" marker-end="url(#arr-g)"/>
  <rect x="542" y="244" width="224" height="126" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="654" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Ujung Kupas Patch Cord</text>
  <text x="556" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#14532d">• Pin 1 (Putih-Oranye) → A+ / B−</text>
  <text x="556" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#14532d">• Pin 2 (Oranye)       → B− / A+</text>
  <text x="556" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#15803d">(Sesuaikan Varian A / B di kanan)</text>
  <text x="556" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#475569">Pin 3–8 isolasi rapi dahulu</text>

  <!-- Cascade Line (drawn cleanly to left of Step 3 badge) -->
  <polyline points="162,359 162,452 385,452 385,480" fill="none" stroke="#0284c7" stroke-width="5" marker-end="url(#arr-b)"/>
  <rect x="198" y="439" width="235" height="26" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="315" y="457" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Patch Cord Cat5e/6 Straight (Utuh)</text>

  <!-- Step 3 Badge (positioned right of vertical wire x=162) -->
  <rect x="196" y="394" width="118" height="30" rx="6" fill="#0284c7"/>
  <text x="255" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">LANGKAH 3</text>
  <text x="326" y="414" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">Colok Straight 8-Pin (#1 RS485A ↔ #2 RS485B)</text>

  <!-- Shoto #2 Box -->
  <rect x="60" y="485" width="440" height="145" rx="10" fill="#273646" stroke="#0f172a" stroke-width="2"/>
  <text x="82" y="517" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">SHOTO SMART-LI #2</text>
  <text x="82" y="539" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">Unit kedua (ujung rantai cascade)</text>

  <rect x="82" y="558" width="160" height="54" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="162" y="581" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">Port RS485A</text>
  <text x="162" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Ujung Rantai</text>

  <rect x="295" y="558" width="180" height="54" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="385" y="581" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">Port RS485B</text>
  <text x="385" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Dari #1 RS485A</text>

  <!-- Terminator Wire & Step 4 Badge (right of vertical wire x=162) -->
  <polyline points="162,612 162,744 240,744" fill="none" stroke="#b45309" stroke-width="5" marker-end="url(#arr-o)"/>
  <rect x="196" y="646" width="118" height="30" rx="6" fill="#b45309"/>
  <text x="255" y="667" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">LANGKAH 4</text>
  <text x="326" y="666" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Pasang Terminator 120 Ω &amp; Uji Ohm (Daya OFF)</text>

  <rect x="248" y="688" width="518" height="118" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="266" y="715" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#92400e">PLUG TERMINATOR CAN 120 Ω (Varian A SmartLi V2.2)</text>
  <text x="266" y="740" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#451a03">• Pasang 1 resistor 120 Ω 1/4W antara Pin 7 (Putih-Coklat) ↔ Pin 8 (Coklat).</text>
  <text x="266" y="762" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#451a03">• Pin 1 sampai 6 pada plug terminator DIBIARKAN KOSONG (tidak disambung).</text>
  <text x="266" y="784" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">• Uji Ohm pada plug lepas = ~120 Ω (jangan ukur Ohm saat baterai ON!).</text>

  <!-- ==================== RIGHT: PINOUT VARIANTS ==================== -->
  <rect x="815" y="128" width="750" height="698" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="840" y="146" width="132" height="30" rx="6" fill="#1e3a5f"/>
  <text x="906" y="167" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">LANGKAH 1</text>
  <text x="985" y="167" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2740">COCOKKAN VARIAN PINOUT RJ45 (T568B)</text>

  <!-- Variant A Card -->
  <rect x="840" y="190" width="700" height="305" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <text x="860" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#0369a1">VARIAN A — SmartLi V2.2 Tanpa DIP (Helios V2.2 Table 6, p.11)</text>
  <text x="860" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#475569">Ciri: tidak ada saklar DIP, komunikasi antar pack pakai CAN (Pin 7/8), butuh terminator 120 Ω di Pin 7↔8</text>

  <!-- Pin 1..8 Variant A -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1e293b">
    <text x="868" y="268" font-weight="700">Pin 1</text>
    <line x1="920" y1="263" x2="975" y2="263" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <line x1="920" y1="263" x2="975" y2="263" stroke="#ffffff" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="990" y="268">Putih-Oranye  →  <tspan font-weight="700" fill="#15803d">RS485 A+</tspan> (kabel utama ke Bridge / SCM-US48I)</text>

    <text x="868" y="296" font-weight="700">Pin 2</text>
    <line x1="920" y1="291" x2="975" y2="291" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <text x="990" y="296">Oranye        →  <tspan font-weight="700" fill="#c2410c">RS485 B−</tspan> (kabel utama ke Bridge / SCM-US48I)</text>

    <text x="868" y="324" font-weight="700">Pin 3</text>
    <line x1="920" y1="319" x2="975" y2="319" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
    <line x1="920" y1="319" x2="975" y2="319" stroke="#ffffff" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="990" y="324">Putih-Hijau   →  RS485 A+ (duplikat internal untuk cascade)</text>

    <text x="868" y="352" font-weight="700">Pin 4</text>
    <line x1="920" y1="347" x2="975" y2="347" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <text x="990" y="352">Biru          →  RS485 B− (duplikat internal untuk cascade)</text>

    <text x="868" y="380" font-weight="700">Pin 5</text>
    <line x1="920" y1="375" x2="975" y2="375" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <line x1="920" y1="375" x2="975" y2="375" stroke="#ffffff" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="990" y="380">Putih-Biru    →  RS485 GND (opsional, ukur dulu sebelum sambung)</text>

    <text x="868" y="408" font-weight="700">Pin 6</text>
    <line x1="920" y1="403" x2="975" y2="403" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
    <text x="990" y="408">Hijau         →  NC (tidak dipakai)</text>

    <text x="868" y="436" font-weight="700">Pin 7</text>
    <line x1="920" y1="431" x2="975" y2="431" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    <line x1="920" y1="431" x2="975" y2="431" stroke="#ffffff" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="990" y="436">Putih-Coklat  →  <tspan font-weight="700" fill="#92400e">CAN H</tspan> (antar pack &amp; Terminator 120 Ω)</text>

    <text x="868" y="464" font-weight="700">Pin 8</text>
    <line x1="920" y1="459" x2="975" y2="459" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    <text x="990" y="464">Coklat        →  <tspan font-weight="700" fill="#92400e">CAN L</tspan> (antar pack &amp; Terminator 120 Ω)</text>
  </g>

  <!-- Variant B Card -->
  <rect x="840" y="510" width="700" height="296" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="860" y="538" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f766e">VARIAN B — Shoto SDA10 TianBangda BMS (Manual SDA10)</text>
  <text x="860" y="558" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#475569">Jika unit Anda memakai papan TianBangda V1.x, pasangan RS485 tetap di Pin 1 &amp; 2 (polaritas terbalik vs Varian A)</text>

  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1e293b">
    <text x="868" y="588" font-weight="700">Pin 1 &amp; 8</text>
    <line x1="948" y1="583" x2="1003" y2="583" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <text x="1018" y="588">Putih-Oranye / Coklat  →  <tspan font-weight="700" fill="#c2410c">RS485 B−</tspan> (Pin 1 &amp; 8 paralel)</text>

    <text x="868" y="618" font-weight="700">Pin 2 &amp; 7</text>
    <line x1="948" y1="613" x2="1003" y2="613" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <text x="1018" y="618">Oranye / Putih-Coklat  →  <tspan font-weight="700" fill="#15803d">RS485 A+</tspan> (Pin 2 &amp; 7 paralel)</text>

    <text x="868" y="648" font-weight="700">Pin 3 &amp; 6</text>
    <line x1="948" y1="643" x2="1003" y2="643" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
    <text x="1018" y="648">Putih-Hijau / Hijau    →  GND</text>

    <text x="868" y="678" font-weight="700">Pin 4 &amp; 5</text>
    <line x1="948" y1="673" x2="1003" y2="673" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <text x="1018" y="678">Biru / Putih-Biru      →  NC (atau CAN pada port khusus)</text>
  </g>

  <rect x="860" y="702" width="660" height="84" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="880" y="728" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0e7490">TIPS PRAKTIS ANTI-BINGUNG:</text>
  <text x="880" y="750" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#155e75">• Pada KEDUA varian, Pin 1 (Putih-Oranye) &amp; Pin 2 (Oranye) adalah 1 pasang twisted pair RS485!</text>
  <text x="880" y="771" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#155e75">• Saat tes dengan SCM-US48I di A03: coba Putih-Oranye=A+ / Oranye=B−. Jika sunyi, tukar A+ ↔ B− (aman).</text>

  <!-- ==================== BOTTOM WARNING ==================== -->
  <rect x="35" y="844" width="1530" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="876" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#991b1b">LARANGAN KERAS SAAT WIRING RJ45 SHOTO:</text>
  <text x="60" y="902" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#7f1d1d">1. Port RJ45 baterai BUKAN port jaringan LAN — JANGAN PERNAH colok ke router, switch PoE, atau port Ethernet laptop/NUC.</text>
  <text x="60" y="924" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#7f1d1d">2. Jangan mencabut atau memasang kabel cascade ketika baterai sedang mengisi (charge) atau membuang arus beban (discharge).</text>
</svg>
