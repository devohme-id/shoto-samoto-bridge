# =============================================================================
# Script Utilitas Shoto BMS - PLTS Samoto ILS6300
# =============================================================================
# Pasang dengan menyalin daftar script ini ke `scripts.yaml` Home Assistant
# (atau aktifkan named include di `configuration.yaml`).
# Seluruh aksi EEPROM bersifat 100% READ-ONLY (protokol 0x7C/0x7E, tanpa tulis).

shoto_test_notification:
  alias: "Shoto BMS: Tes Notifikasi & Ringkasan Bank"
  description: >-
    Mengirim notifikasi uji coba ke dashboard Home Assistant dan aplikasi HP
    (notify.notify) berisi ringkasan status live bank baterai PLTS Samoto ILS6300.
  mode: single
  sequence:
    - service: persistent_notification.create
      data:
        notification_id: shoto_bms_test_notification
        title: "[TES] PLTS Samoto ILS6300 - Ringkasan Bank Baterai"
        message: >-
          Site: PLTS Samoto ILS6300.
          SOC: {{ states('sensor.shoto_ils6300_bank_soc') }} % |
          Tegangan: {{ states('sensor.shoto_ils6300_bank_voltage') }} V |
          Arus: {{ states('sensor.shoto_ils6300_bank_current') }} A |
          Daya: {{ states('sensor.shoto_ils6300_bank_power') }} W |
          Delta V: {{ states('sensor.shoto_ils6300_bank_cell_dv_mv') }} mV |
          Pack Online: {{ states('sensor.shoto_ils6300_bank_pack_count') }} / 4 |
          Mode Inverter: {{ states('sensor.shoto_ils6300_diag_inv_mode') }} |
          Inhibit: {{ states('sensor.shoto_ils6300_bank_inhibit_reason') }}.
    - service: notify.notify
      continue_on_error: true
      data:
        title: "[TES] PLTS Samoto ILS6300 - Status Live"
        message: >-
          PLTS Samoto ILS6300 OK:
          SOC={{ states('sensor.shoto_ils6300_bank_soc') }}%,
          V={{ states('sensor.shoto_ils6300_bank_voltage') }}V,
          I={{ states('sensor.shoto_ils6300_bank_current') }}A,
          Packs={{ states('sensor.shoto_ils6300_bank_pack_count') }}/4,
          Inv={{ states('sensor.shoto_ils6300_diag_inv_mode') }}.

shoto_audit_all_packs_and_notify:
  alias: "Shoto BMS: Audit EEPROM Semua Pack (Read-Only) & Notifikasi"
  description: >-
    Memicu pembacaan EEPROM Shoto secara read-only untuk semua pack online,
    menunggu 25 detik hingga siklus audit 1..4 pack selesai, lalu mengirim
    ringkasan parameter proteksi dan alarm tiap pack.
  mode: single
  sequence:
    - service: button.press
      target:
        entity_id: button.shoto_ils6300_btn_audit_eeprom_all
    - delay: "00:00:25"
    - service: persistent_notification.create
      data:
        notification_id: shoto_bms_eeprom_audit_summary
        title: "[AUDIT EEPROM] PLTS Samoto ILS6300 (Read-Only)"
        message: |
          Site: PLTS Samoto ILS6300 (100% Read-Only).
          {% set packs = [
            (1, 'binary_sensor.shoto_ils6300_pack1_eep_valid', 'binary_sensor.shoto_ils6300_pack1_online'),
            (2, 'binary_sensor.shoto_ils6300_pack2_eep_valid', 'binary_sensor.shoto_ils6300_pack2_online'),
            (3, 'binary_sensor.shoto_ils6300_pack3_eep_valid', 'binary_sensor.shoto_ils6300_pack3_online'),
            (4, 'binary_sensor.shoto_ils6300_pack4_eep_valid', 'binary_sensor.shoto_ils6300_pack4_online')
          ] %}
          {%- for idx, eid, online_eid in packs -%}
          {%- if state_attr(eid, 'valid') %}
          Pack #{{ idx }} (Addr {{ state_attr(eid, 'addr') }}): Valid={{ state_attr(eid, 'valid') }}, ProtOK={{ state_attr(eid, 'p_ok') }}, AlarmOK={{ state_attr(eid, 'a_ok') }} ({{ state_attr(eid, 'tags') }} tags)
          - Proteksi: CellOV={{ state_attr(eid, 'p_cov') }}mV, CellUV={{ state_attr(eid, 'p_cuv') }}mV, PackOV={{ ((state_attr(eid, 'p_pov') | float(0)) / 100) | round(2) }}V, PackUV={{ ((state_attr(eid, 'p_puv') | float(0)) / 100) | round(2) }}V, CCV={{ ((state_attr(eid, 'p_ccv') | float(0)) / 100) | round(2) }}V
          - Alarm: CellOV={{ state_attr(eid, 'a_cov') }}mV, CellUV={{ state_attr(eid, 'a_cuv') }}mV, ChgOC={{ state_attr(eid, 'a_coc') }}cA, DsgOC={{ state_attr(eid, 'a_doc') }}cA, dV={{ state_attr(eid, 'a_cdv') }}mV, LowSOC={{ state_attr(eid, 'a_lsoc') }}%
          {%- elif idx <= 2 or is_state(online_eid, 'on') %}
          Pack #{{ idx }}: Belum ada data audit EEPROM.
          {%- endif -%}
          {%- endfor %}
    - service: notify.notify
      continue_on_error: true
      data:
        title: "[AUDIT EEPROM] PLTS Samoto ILS6300 Selesai"
        message: >-
          {% set packs = [
            (1, 'binary_sensor.shoto_ils6300_pack1_eep_valid', 'binary_sensor.shoto_ils6300_pack1_online'),
            (2, 'binary_sensor.shoto_ils6300_pack2_eep_valid', 'binary_sensor.shoto_ils6300_pack2_online'),
            (3, 'binary_sensor.shoto_ils6300_pack3_eep_valid', 'binary_sensor.shoto_ils6300_pack3_online'),
            (4, 'binary_sensor.shoto_ils6300_pack4_eep_valid', 'binary_sensor.shoto_ils6300_pack4_online')
          ] %}
          {% set ns = namespace(parts=[]) %}
          {% for idx, eid, online_eid in packs %}
            {% if state_attr(eid, 'valid') %}
              {% set ns.parts = ns.parts + ['Pack#' ~ idx ~ '=OK(CellOV=' ~ state_attr(eid, 'p_cov') ~ 'mV,CellUV=' ~ state_attr(eid, 'p_cuv') ~ 'mV)'] %}
            {% elif idx <= 2 or is_state(online_eid, 'on') %}
              {% set ns.parts = ns.parts + ['Pack#' ~ idx ~ '=Belum'] %}
            {% endif %}
          {% endfor %}
          Audit EEPROM read-only PLTS Samoto ILS6300 selesai. {{ ns.parts | join(', ') }}
