            card:
              type: markdown
              title: "Kontrol Kritis Terkunci"
              content: |
                > **KONTROL KRITIS TERKUNCI** — Aktifkan **Maintenance Unlock** (`ON`) di atas untuk membuka pengaturan **Bridge Mode**, **Dynamic Pack Discovery**, **Policy CVL/DVL/CCL/DCL/MaxΔV**, **Reset Policy**, dan **Restart ESP32** (terkunci otomatis dalam 5 menit).

          - type: conditional
            conditions:
              - condition: state
                entity: switch.shoto_ihf6200_sw_maint_unlock
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: |
                    > **MAINTENANCE UNLOCK AKTIF** ({{ states('sensor.shoto_ihf6200_maint_unlock_rem_s') | int(0) }} detik tersisa). Kontrol kritis kini terbuka dan akan terkunci otomatis saat timer habis.

                - type: entities
