  # ===========================================================================
  # VIEW 3: Shoto EEPROM Audit (Read-Only)
  # ===========================================================================
  - title: Shoto EEPROM Audit (Read-Only)
    path: eeprom-audit
    icon: mdi:memory
    cards:
      - type: markdown
        title: Audit Parameter EEPROM Shoto BMS (100% Read-Only)
        content: |
          Menampilkan **13 register proteksi** (`cmd 0x06..0x50`) dan **43 tag alarm** (`cmd 0x43`, tag `0x00..0x2A`) yang dibaca secara **read-only** dari protokol TianBangda `0x7C`/`0x7E` (tidak pernah mengirim perintah tulis `0xAA`).

      - type: entities
        title: Kontrol Audit EEPROM & Status Validitas
        show_header_toggle: false
        entities:
          - entity: button.shoto_ihf6200_btn_audit_eeprom_all
            name: Audit EEPROM (Semua Pack)
          - entity: button.shoto_ihf6200_pack1_btn_audit_eeprom
            name: Audit EEPROM Pack #1
          - entity: button.shoto_ihf6200_pack2_btn_audit_eeprom
            name: Audit EEPROM Pack #2
          - entity: button.shoto_ihf6200_pack3_btn_audit_eeprom
            name: Audit EEPROM Pack #3
          - entity: button.shoto_ihf6200_pack4_btn_audit_eeprom
            name: Audit EEPROM Pack #4
          - entity: binary_sensor.shoto_ihf6200_pack1_eep_valid
            name: Pack #1 EEPROM Valid
          - entity: binary_sensor.shoto_ihf6200_pack2_eep_valid
            name: Pack #2 EEPROM Valid
          - entity: binary_sensor.shoto_ihf6200_pack3_eep_valid
            name: Pack #3 EEPROM Valid
          - entity: binary_sensor.shoto_ihf6200_pack4_eep_valid
            name: Pack #4 EEPROM Valid

      # --- Pack #1 EEPROM ---
      - type: markdown
        title: "Pack #1 - EEPROM Audit (13 Proteksi + 43 Alarm)"
        content: |
          {% if state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'valid') %}
          **Addr:** {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'addr') }} | **Valid:** {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'valid') }} | **Audit Uptime:** {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'aud_ms') }} ms | **Prot OK:** {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_ok') }} | **Alarm OK:** {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_ok') }} ({{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'tags') }} tags)

          ### 13 Parameter Proteksi (cmd 0x06..0x50)
          | Cmd | Parameter | Nilai |
          |---|---|---:|
          | `0x06` | Cell OV Protection | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_cov') }} mV |
          | `0x07` | Cell OV Recovery | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_covr') }} mV |
          | `0x09` | Cell UV Protection | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_cuv') }} mV |
          | `0x0A` | Cell UV Recovery | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_cuvr') }} mV |
          | `0x2A` | Pack OV Protection | {{ ((state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_pov') | float(0)) / 100) | round(2) }} V ({{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_pov') }} cV) |
          | `0x2B` | Pack OV Recovery | {{ ((state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_povr') | float(0)) / 100) | round(2) }} V ({{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_povr') }} cV) |
          | `0x2E` | Pack UV Protection | {{ ((state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_puv') | float(0)) / 100) | round(2) }} V ({{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_puv') }} cV) |
          | `0x2F` | Pack UV Recovery | {{ ((state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_puvr') | float(0)) / 100) | round(2) }} V ({{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_puvr') }} cV) |
          | `0x35` | Const Charge Voltage | {{ ((state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_ccv') | float(0)) / 100) | round(2) }} V ({{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_ccv') }} cV) |
          | `0x2D` | Const Charge Current | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_cci') }} (0.01A/raw) |
          | `0x32` | Cell Sleep Voltage | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_slpv') }} mV |
          | `0x3E` | UV Off Interval | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_uvo') }} |
          | `0x50` | Sleep Time | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'p_slpt') }} min |

          ### 43 Parameter Alarm (cmd 0x43, tag 0x00..0x2A)
          | Alarm | Trigger | Delay | Recovery |
          |---|---:|---:|---:|
          | Cell OV | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cov') }} mV | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_covd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_covr') }} mV |
          | Cell UV | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cuv') }} mV | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cuvd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cuvr') }} mV |
          | Pack OV | {{ ((state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_pov') | float(0)) / 100) | round(2) }} V ({{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_pov') }} cV) | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_povd') }} ms | {{ ((state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_povr') | float(0)) / 100) | round(2) }} V ({{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_povr') }} cV) |
          | Pack UV | {{ ((state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_puv') | float(0)) / 100) | round(2) }} V ({{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_puv') }} cV) | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_puvd') }} ms | {{ ((state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_puvr') | float(0)) / 100) | round(2) }} V ({{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_puvr') }} cV) |
          | Charge OC | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_coc') }} cA | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cocd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cocr') }} cA |
          | Discharge OC | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_doc') }} cA | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_docd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_docr') }} cA |
          | Charge OT | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cot') }} C | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cotd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cotr') }} C |
          | Charge UT | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cut') }} C | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cutd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cutr') }} C |
          | Discharge OT | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_dot') }} C | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_dotd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_dotr') }} C |
          | Discharge UT | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_dut') }} C | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_dutd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_dutr') }} C |
          | MOSFET OT | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_mot') }} C | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_motd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_motr') }} C |
          | Low SOC | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_lsoc') }} % | - | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_lsocr') }} % |
          | Cell Diff (dV) | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cdv') }} mV | - | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_cdvr') }} mV |
          | Env OT | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_eot') }} C | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_eotd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_eotr') }} C |
          | Env UT | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_eut') }} C | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_eutd') }} ms | {{ state_attr('binary_sensor.shoto_ihf6200_pack1_eep_valid', 'a_eutr') }} C |
          {% else %}
          Belum ada data audit EEPROM (tekan tombol **Audit EEPROM Read-Only**).
          {% endif %}

