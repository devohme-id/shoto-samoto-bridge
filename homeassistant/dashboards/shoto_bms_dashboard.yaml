title: PLTS Samoto IHF6200 - Shoto BMS
views:
  # ===========================================================================
  # VIEW 1: Overview & Power Flow
  # ===========================================================================
  - title: Overview & Power Flow
    path: overview
    icon: mdi:battery-charging-high
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.shoto_ihf6200_bank_valid
            state: "off"
        card:
          type: markdown
          title: PERINGATAN INHIBIT / FAIL-CLOSED
          content: |
            > **INVERTER INHIBIT AKTIF** — Bridge menghentikan izin charge/discharge demi keselamatan bank baterai.
            - **Alasan Inhibit:** `{{ states('sensor.shoto_ihf6200_bank_inhibit_reason') }}`
            - **Pack Online:** {{ states('sensor.shoto_ihf6200_bank_pack_count') }} / 4
            - **Delta V Bank:** {{ states('sensor.shoto_ihf6200_bank_cell_dv_mv') }} mV
            - **Flag Proteksi / Fault:** `prot={{ states('sensor.shoto_ihf6200_bank_prot_flags') }}` | `fault={{ states('sensor.shoto_ihf6200_bank_fault_flags') }}`

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.shoto_ihf6200_bank_soc
            name: Bank SOC
            min: 0
            max: 100
            needle: true
            severity:
              green: 35
              yellow: 18
              red: 0
          - type: gauge
            entity: sensor.shoto_ihf6200_bank_power
            name: Daya Bank (+Chg / -Dsg)
            min: -6500
            max: 6500
            needle: true

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.shoto_ihf6200_bank_voltage
            name: Tegangan Bank
          - type: tile
            entity: sensor.shoto_ihf6200_bank_current
            name: Arus Bank
          - type: tile
            entity: sensor.shoto_ihf6200_bank_pack_count
            name: Pack Online
          - type: tile
            entity: sensor.shoto_ihf6200_bank_soh
            name: Bank SOH
          - type: tile
            entity: sensor.shoto_ihf6200_bank_rem_cap_ah
            name: Sisa Kapasitas
          - type: tile
            entity: sensor.shoto_ihf6200_bank_cycles
            name: Siklus Bank

      - type: entities
        title: Status Bank & Limit 63H Inverter (PYL_FULL)
        show_header_toggle: false
        entities:
          - entity: binary_sensor.shoto_ihf6200_bank_valid
            name: Bank Valid
          - entity: sensor.shoto_ihf6200_bank_inhibit_reason
            name: Alasan Inhibit
          - entity: sensor.shoto_ihf6200_diag_inv_mode
            name: Mode Inverter
          - entity: sensor.shoto_ihf6200_diag_proto
            name: Protokol Shoto
          - entity: binary_sensor.shoto_ihf6200_bank_allow_charge
            name: Izin Charge (63H)
          - entity: binary_sensor.shoto_ihf6200_bank_allow_discharge
            name: Izin Discharge (63H)
          - entity: sensor.shoto_ihf6200_bank_cvl
            name: Charge Voltage Limit (CVL)
          - entity: sensor.shoto_ihf6200_bank_dvl
            name: Discharge Voltage Limit (DVL)
          - entity: sensor.shoto_ihf6200_bank_ccl
            name: Charge Current Limit (CCL)
          - entity: sensor.shoto_ihf6200_bank_dcl
            name: Discharge Current Limit (DCL)
          - entity: sensor.shoto_ihf6200_bank_capacity_ah
            name: Kapasitas Terdaftar (Ah)
          - entity: sensor.shoto_ihf6200_bank_raw_soc
            name: Raw SOC Bank

      - type: entities
        title: Envelope Sel & Suhu Bank
        show_header_toggle: false
        entities:
          - entity: sensor.shoto_ihf6200_bank_cell_min_mv
            name: Sel Terendah (Bank)
          - entity: sensor.shoto_ihf6200_bank_cell_max_mv
            name: Sel Tertinggi (Bank)
          - entity: sensor.shoto_ihf6200_bank_cell_dv_mv
            name: Delta V Sel (Bank)
          - entity: sensor.shoto_ihf6200_bank_temp_min
            name: Suhu Minimum
          - entity: sensor.shoto_ihf6200_bank_temp_max
            name: Suhu Maksimum
          - entity: sensor.shoto_ihf6200_bank_temp_avg
            name: Suhu Rata-rata
          - entity: sensor.shoto_ihf6200_bank_warn_flags
            name: Bank Warn Flags
          - entity: sensor.shoto_ihf6200_bank_prot_flags
            name: Bank Prot Flags
          - entity: sensor.shoto_ihf6200_bank_fault_flags
            name: Bank Fault Flags

      - type: history-graph
        title: Histori 24 Jam - SOC & Tegangan Bank
        hours_to_show: 24
        entities:
          - entity: sensor.shoto_ihf6200_bank_soc
            name: SOC (%)
          - entity: sensor.shoto_ihf6200_bank_voltage
            name: Tegangan (V)

      - type: history-graph
        title: Histori 24 Jam - Arus & Daya Bank
        hours_to_show: 24
        entities:
          - entity: sensor.shoto_ihf6200_bank_current
            name: Arus (A)
          - entity: sensor.shoto_ihf6200_bank_power
            name: Daya (W)

      - type: history-graph
        title: Histori 24 Jam - Delta V Sel & Suhu Maks Bank
        hours_to_show: 24
        entities:
          - entity: sensor.shoto_ihf6200_bank_cell_dv_mv
            name: Delta V (mV)
          - entity: sensor.shoto_ihf6200_bank_temp_max
            name: Suhu Maks (C)

  # ===========================================================================
  # VIEW 2: Packs & 15-Cell Matrix
  # ===========================================================================
  - title: Packs & 15-Cell Matrix
    path: packs-cells
    icon: mdi:view-grid-outline
    cards:
      - type: entities
        title: Status Ringkas Pack #1..#4
        show_header_toggle: false
        entities:
          - entity: binary_sensor.shoto_ihf6200_pack1_online
            name: Pack 1 Online
          - entity: binary_sensor.shoto_ihf6200_pack2_online
            name: Pack 2 Online
          - entity: binary_sensor.shoto_ihf6200_pack3_online
            name: Pack 3 Online
          - entity: binary_sensor.shoto_ihf6200_pack4_online
            name: Pack 4 Online

      - type: history-graph
        title: Pembagian Arus Pack #1..#4 (Current Sharing 24 Jam)
        hours_to_show: 24
        entities:
          - entity: sensor.shoto_ihf6200_pack1_current
            name: Pack 1 (A)
          - entity: sensor.shoto_ihf6200_pack2_current
            name: Pack 2 (A)
          - entity: sensor.shoto_ihf6200_pack3_current
            name: Pack 3 (A)
          - entity: sensor.shoto_ihf6200_pack4_current
            name: Pack 4 (A)

      - type: history-graph
        title: Histori Delta V Sel Pack #1..#4 (24 Jam)
        hours_to_show: 24
        entities:
          - entity: sensor.shoto_ihf6200_pack1_cell_dv_mv
            name: Pack 1 dV (mV)
          - entity: sensor.shoto_ihf6200_pack2_cell_dv_mv
            name: Pack 2 dV (mV)
          - entity: sensor.shoto_ihf6200_pack3_cell_dv_mv
            name: Pack 3 dV (mV)
          - entity: sensor.shoto_ihf6200_pack4_cell_dv_mv
            name: Pack 4 dV (mV)

      # --- Pack #1 ---
      - type: vertical-stack
        cards:
          - type: entities
            title: "Pack #1 - Ringkasan & Diagnostik"
            show_header_toggle: false
            entities:
              - binary_sensor.shoto_ihf6200_pack1_online
              - sensor.shoto_ihf6200_pack1_voltage
              - sensor.shoto_ihf6200_pack1_current
              - sensor.shoto_ihf6200_pack1_soc
              - sensor.shoto_ihf6200_pack1_soh
              - sensor.shoto_ihf6200_pack1_rem_cap_ah
              - sensor.shoto_ihf6200_pack1_cycles
              - sensor.shoto_ihf6200_pack1_cell_min_mv
              - sensor.shoto_ihf6200_pack1_cell_max_mv
              - sensor.shoto_ihf6200_pack1_cell_dv_mv
              - sensor.shoto_ihf6200_pack1_prot_flags
              - sensor.shoto_ihf6200_pack1_fault_flags
              - sensor.shoto_ihf6200_pack1_warn_flags
              - sensor.shoto_ihf6200_pack1_miss_cnt
              - sensor.shoto_ihf6200_pack1_age_ms

          - type: markdown
            title: "Pack #1 - Matriks 15 Sel (Highlight Min/Max)"
            content: |
              {% set cmin = states('sensor.shoto_ihf6200_pack1_cell_min_mv') | int(0) %}
              {% set cmax = states('sensor.shoto_ihf6200_pack1_cell_max_mv') | int(0) %}
              {% set vals = [
                states('sensor.shoto_ihf6200_pack1_cell_01') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_02') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_03') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_04') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_05') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_06') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_07') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_08') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_09') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_10') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_11') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_12') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_13') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_14') | int(0),
                states('sensor.shoto_ihf6200_pack1_cell_15') | int(0)
              ] %}
              **Min:** {{ cmin }} mV | **Max:** {{ cmax }} mV | **Delta V:** {{ states('sensor.shoto_ihf6200_pack1_cell_dv_mv') | int(0) }} mV
              | Sel | mV | Sel | mV | Sel | mV |
              |---|---:|---|---:|---|---:|
              {% for r in range(0, 5) -%}
              {%- set v1 = vals[r] -%}
              {%- set v2 = vals[r + 5] -%}
              {%- set v3 = vals[r + 10] -%}
              | C{{ '%02d' % (r + 1) }} | {{ 'MIN ' if v1 == cmin and cmin > 0 else ('MAX ' if v1 == cmax and cmax > 0 else '') }}{{ v1 }} | C{{ '%02d' % (r + 6) }} | {{ 'MIN ' if v2 == cmin and cmin > 0 else ('MAX ' if v2 == cmax and cmax > 0 else '') }}{{ v2 }} | C{{ '%02d' % (r + 11) }} | {{ 'MIN ' if v3 == cmin and cmin > 0 else ('MAX ' if v3 == cmax and cmax > 0 else '') }}{{ v3 }} |
              {% endfor %}

