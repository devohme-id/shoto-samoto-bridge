# =============================================================================
# Konfigurasi Referensi Home Assistant — PLTS Samoto IHF6200 & Shoto BMS
# =============================================================================
# Untuk pengguna HAOS (Opsi A): gabungkan blok `http:` dan `recorder:` di bawah
# ke file `/config/configuration.yaml` melalui add-on File Editor / Studio Code.
# Untuk pengguna Docker Compose (Opsi B): jalankan dari folder `homeassistant/`:
#   mkdir -p ha_config && cp configuration.yaml ha_config/configuration.yaml
#   printf '[]\n' > ha_config/automations.yaml
#   printf '{}\n' > ha_config/scripts.yaml
#   printf '[]\n' > ha_config/scenes.yaml
# (atau jalankan `docker compose up -d homeassistant` sekali terlebih dahulu
# sebelum menimpa `ha_config/configuration.yaml` agar file `!include` sudah dibuat,
# jika tidak HA akan masuk Safe Mode karena file include belum ada).

default_config:

# Load komponen frontend bawaan Home Assistant (termasuk tema & Lovelace UI).
frontend:

# =============================================================================
# Keamanan Reverse Proxy & Proteksi Brute-Force Internet
# =============================================================================
# Wajib aktif jika Home Assistant diakses lewat HTTPS (Nginx Proxy Manager / Caddy).
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - "::1"
    - 172.30.33.0/24   # Subnet internal Add-on HAOS (termasuk Nginx Proxy Manager)
    - 172.16.0.0/12    # Subnet internal Docker Bridge (jika pakai Opsi B Docker Compose)
    - 192.168.10.250     # Ganti dengan IP LAN Mini PC Anda jika berbeda
  ip_ban_enabled: true
  login_attempts_threshold: 5

# =============================================================================
# Optimasi Recorder untuk SSD Mini PC (Awet 24/7)
# =============================================================================
# Menyimpan histori 30 hari untuk bank, pack, 15 sel, suhu, dan audit EEPROM,
# sambil mengurangi write SSD lewat commit_interval dan mengecualikan frame
# hex TX mentah berfrekuensi tinggi.
recorder:
  purge_keep_days: 30
  commit_interval: 15
  exclude:
    entity_globs:
      - sensor.*_diag_tx61
      - sensor.*_diag_tx62
      - sensor.*_diag_tx63

# =============================================================================
# File Otomasi, Script & Dashboard Shoto BMS (Multi-Inverter: IHF6200 + ILS6300)
# =============================================================================
# Standar bawaan HA agar boot pertama bersih sebelum file Shoto disalin:
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Panduan pemasangan file dashboard & otomasi untuk 2 inverter terpisah:
# 1. Dashboard 4 tampilan (masing-masing dibuat sebagai dashboard terpisah di HA UI):
#    - Inverter #1 (IHF6200): `homeassistant/dashboards/shoto_bms_dashboard.yaml`
#    - Inverter #2 (ILS6300): `homeassistant/dashboards/shoto_ils6300_dashboard.yaml`
# 2. Otomasi & Script notifikasi HP (keduanya aman berjalan bersamaan tanpa bentrok ID):
#    - Inverter #1 (IHF6200): `automations_shoto_bms.yaml` & `scripts_shoto_bms.yaml`
#    - Inverter #2 (ILS6300): `automations_shoto_ils6300.yaml` & `scripts_shoto_ils6300.yaml`
#    Aktifkan named include di bawah jika file diletakkan di `/config/` (HAOS) atau `ha_config/` (Docker):
#      automation shoto_ihf6200: !include automations_shoto_bms.yaml
#      automation shoto_ils6300: !include automations_shoto_ils6300.yaml
#      script shoto_ihf6200: !include scripts_shoto_bms.yaml
#      script shoto_ils6300: !include scripts_shoto_ils6300.yaml
