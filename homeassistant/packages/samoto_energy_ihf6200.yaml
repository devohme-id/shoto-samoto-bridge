# Paket pemantauan IHF6200. Dashboard terpisah memakai entity_id di bawah.
mqtt:
  sensor:
    - <<: &ihf6200_grid
        state_topic: "samoto_energy/ihf6200/grid"
        expire_after: 20
        availability_mode: all
        availability:
          - topic: "samoto_energy/ihf6200/status"
          - topic: "samoto_energy/ihf6200/grid"
            value_template: >-
              {{ 'online' if value_json is mapping and value_json.ok is sameas true else 'offline' }}
        device: &ihf6200_meter_device
          identifiers: [samoto_energy_ihf6200]
          name: "Monitoring Energi IHF6200"
          manufacturer: Peacefair
          model: "PZEM-004T V3 / PZEM-017"
      name: "IHF6200 PLN Tegangan"
      unique_id: samoto_energy_ihf6200_grid_voltage
      default_entity_id: sensor.samoto_energy_ihf6200_grid_voltage
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      value_template: >-
        {{ value_json.voltage_v if value_json is mapping and value_json.voltage_v is number else none }}
    - <<: *ihf6200_grid
      name: "IHF6200 PLN Arus"
      unique_id: samoto_energy_ihf6200_grid_current
      default_entity_id: sensor.samoto_energy_ihf6200_grid_current
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"
      value_template: >-
        {{ value_json.current_a if value_json is mapping and value_json.current_a is number else none }}
    - <<: *ihf6200_grid
      name: "IHF6200 PLN Daya aktif"
      unique_id: samoto_energy_ihf6200_grid_power
      default_entity_id: sensor.samoto_energy_ihf6200_grid_power
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      value_template: >-
        {{ value_json.power_w if value_json is mapping and value_json.power_w is number else none }}
    - <<: *ihf6200_grid
      name: "IHF6200 PLN Energi total"
      unique_id: samoto_energy_ihf6200_grid_energy
      default_entity_id: sensor.samoto_energy_ihf6200_grid_energy
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "kWh"
      value_template: >-
        {{ (value_json.energy_wh / 1000) | round(3) if value_json is mapping and value_json.energy_wh is number else none }}
    - <<: *ihf6200_grid
      name: "IHF6200 PLN Frekuensi"
      unique_id: samoto_energy_ihf6200_grid_frequency
      default_entity_id: sensor.samoto_energy_ihf6200_grid_frequency
      device_class: frequency
      state_class: measurement
      unit_of_measurement: "Hz"
      value_template: >-
        {{ value_json.frequency_hz if value_json is mapping and value_json.frequency_hz is number else none }}
    - <<: *ihf6200_grid
      name: "IHF6200 PLN Faktor daya"
      unique_id: samoto_energy_ihf6200_grid_power_factor
      default_entity_id: sensor.samoto_energy_ihf6200_grid_power_factor
      device_class: power_factor
      state_class: measurement
      value_template: >-
        {{ value_json.power_factor if value_json is mapping and value_json.power_factor is number else none }}
    - <<: &ihf6200_load
        state_topic: "samoto_energy/ihf6200/load"
        expire_after: 20
        availability_mode: all
        availability:
          - topic: "samoto_energy/ihf6200/status"
          - topic: "samoto_energy/ihf6200/load"
            value_template: >-
              {{ 'online' if value_json is mapping and value_json.ok is sameas true else 'offline' }}
        device: *ihf6200_meter_device
      name: "IHF6200 Beban Tegangan"
      unique_id: samoto_energy_ihf6200_load_voltage
      default_entity_id: sensor.samoto_energy_ihf6200_load_voltage
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      value_template: >-
        {{ value_json.voltage_v if value_json is mapping and value_json.voltage_v is number else none }}
    - <<: *ihf6200_load
      name: "IHF6200 Beban Arus"
      unique_id: samoto_energy_ihf6200_load_current
      default_entity_id: sensor.samoto_energy_ihf6200_load_current
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"
      value_template: >-
        {{ value_json.current_a if value_json is mapping and value_json.current_a is number else none }}
    - <<: *ihf6200_load
      name: "IHF6200 Beban Daya aktif"
      unique_id: samoto_energy_ihf6200_load_power
      default_entity_id: sensor.samoto_energy_ihf6200_load_power
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      value_template: >-
        {{ value_json.power_w if value_json is mapping and value_json.power_w is number else none }}
    - <<: *ihf6200_load
      name: "IHF6200 Beban Energi total"
      unique_id: samoto_energy_ihf6200_load_energy
      default_entity_id: sensor.samoto_energy_ihf6200_load_energy
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "kWh"
      value_template: >-
        {{ (value_json.energy_wh / 1000) | round(3) if value_json is mapping and value_json.energy_wh is number else none }}
    - <<: *ihf6200_load
      name: "IHF6200 Beban Frekuensi"
      unique_id: samoto_energy_ihf6200_load_frequency
      default_entity_id: sensor.samoto_energy_ihf6200_load_frequency
      device_class: frequency
      state_class: measurement
      unit_of_measurement: "Hz"
      value_template: >-
        {{ value_json.frequency_hz if value_json is mapping and value_json.frequency_hz is number else none }}
    - <<: *ihf6200_load
      name: "IHF6200 Beban Faktor daya"
      unique_id: samoto_energy_ihf6200_load_power_factor
      default_entity_id: sensor.samoto_energy_ihf6200_load_power_factor
      device_class: power_factor
      state_class: measurement
      value_template: >-
        {{ value_json.power_factor if value_json is mapping and value_json.power_factor is number else none }}
    - <<: &ihf6200_pv
        state_topic: "samoto_energy/ihf6200/pv"
        expire_after: 20
        availability_mode: all
        availability:
          - topic: "samoto_energy/ihf6200/status"
          - topic: "samoto_energy/ihf6200/pv"
            value_template: >-
              {{ 'online' if value_json is mapping and value_json.ok is sameas true else 'offline' }}
        device: *ihf6200_meter_device
      name: "IHF6200 PV Tegangan"
      unique_id: samoto_energy_ihf6200_pv_voltage
      default_entity_id: sensor.samoto_energy_ihf6200_pv_voltage
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      value_template: >-
        {{ value_json.voltage_v if value_json is mapping and value_json.voltage_v is number else none }}
    - <<: *ihf6200_pv
      name: "IHF6200 PV Arus"
      unique_id: samoto_energy_ihf6200_pv_current
      default_entity_id: sensor.samoto_energy_ihf6200_pv_current
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"
      value_template: >-
        {{ value_json.current_a if value_json is mapping and value_json.current_a is number else none }}
    - <<: *ihf6200_pv
      name: "IHF6200 PV Daya aktif"
      unique_id: samoto_energy_ihf6200_pv_power
      default_entity_id: sensor.samoto_energy_ihf6200_pv_power
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      value_template: >-
        {{ value_json.power_w if value_json is mapping and value_json.power_w is number else none }}
    - <<: *ihf6200_pv
      name: "IHF6200 PV Energi total"
      unique_id: samoto_energy_ihf6200_pv_energy
      default_entity_id: sensor.samoto_energy_ihf6200_pv_energy
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "kWh"
      value_template: >-
        {{ (value_json.energy_wh / 1000) | round(3) if value_json is mapping and value_json.energy_wh is number else none }}
    - name: "IHF6200 Status Meter PV"
      unique_id: samoto_energy_ihf6200_pv_status
      default_entity_id: sensor.samoto_energy_ihf6200_pv_status
      state_topic: "samoto_energy/ihf6200/pv"
      availability_topic: "samoto_energy/ihf6200/status"
      expire_after: 20
      device: *ihf6200_meter_device
      entity_category: diagnostic
      value_template: >-
        {{ {'ok': 'Aktif', 'disabled': 'PV belum diaktifkan', 'shunt_unreadable': 'Register shunt tidak terbaca', 'shunt_mismatch': 'Setelan shunt bukan 100 A', 'invalid_read': 'Pembacaan gagal', 'above_design_voc': 'Tegangan melebihi Voc desain'}.get(value_json.reason | default(''), 'Status tidak dikenal') if value_json is mapping else 'Pesan tidak valid' }}
    - <<: &ihf6200_battery
        state_topic: "shoto_bridge/ihf6200/bank"
        expire_after: 15
        availability_mode: all
        availability:
          - topic: "shoto_bridge/ihf6200/status"
          - topic: "shoto_bridge/ihf6200/bank"
            value_template: >-
              {{ 'online' if value_json is mapping and value_json.valid is sameas true and value_json.has_telem is sameas true and value_json.p is number else 'offline' }}
      name: "IHF6200 Baterai Tegangan"
      unique_id: samoto_energy_ihf6200_battery_voltage
      default_entity_id: sensor.samoto_energy_ihf6200_battery_voltage
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      value_template: >-
        {{ value_json.v if value_json is mapping and value_json.v is number else none }}
    - <<: *ihf6200_battery
      name: "IHF6200 Baterai Arus bertanda"
      unique_id: samoto_energy_ihf6200_battery_current
      default_entity_id: sensor.samoto_energy_ihf6200_battery_current
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"
      value_template: >-
        {{ value_json.i if value_json is mapping and value_json.i is number else none }}
    - <<: *ihf6200_battery
      name: "IHF6200 Baterai SOC"
      unique_id: samoto_energy_ihf6200_battery_soc
      default_entity_id: sensor.samoto_energy_ihf6200_battery_soc
      device_class: battery
      state_class: measurement
      unit_of_measurement: "%"
      value_template: >-
        {{ value_json.soc if value_json is mapping and value_json.soc is number else none }}
    - <<: *ihf6200_battery
      name: "IHF6200 Baterai Daya bertanda"
      unique_id: samoto_energy_ihf6200_battery_power
      default_entity_id: sensor.samoto_energy_ihf6200_battery_power
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      value_template: >-
        {{ value_json.p if value_json is mapping and value_json.p is number else none }}
    - <<: *ihf6200_battery
      name: "IHF6200 Baterai Daya charge"
      unique_id: samoto_energy_ihf6200_battery_charge_power
      default_entity_id: sensor.samoto_energy_ihf6200_battery_charge_power
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      value_template: >-
        {% set p = value_json.p if value_json is mapping and value_json.p is number else none %} {{ ([p, 0] | max) if p is not none else none }}
    - <<: *ihf6200_battery
      name: "IHF6200 Baterai Daya discharge"
      unique_id: samoto_energy_ihf6200_battery_discharge_power
      default_entity_id: sensor.samoto_energy_ihf6200_battery_discharge_power
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      value_template: >-
        {% set p = value_json.p if value_json is mapping and value_json.p is number else none %} {{ ([-p, 0] | max) if p is not none else none }}
    - <<: *ihf6200_battery
      name: "IHF6200 Baterai Arah daya"
      unique_id: samoto_energy_ihf6200_battery_mode
      default_entity_id: sensor.samoto_energy_ihf6200_battery_mode
      value_template: >-
        {% set p = value_json.p if value_json is mapping and value_json.p is number else none %} {{ ('Charging' if p > 0 else 'Discharging' if p < 0 else 'Idle') if p is not none else none }}

utility_meter:
  samoto_energy_ihf6200_grid_daily:
    unique_id: samoto_energy_ihf6200_grid_daily
    source: sensor.samoto_energy_ihf6200_grid_energy
    cycle: daily
    periodically_resetting: false
  samoto_energy_ihf6200_grid_monthly:
    unique_id: samoto_energy_ihf6200_grid_monthly
    source: sensor.samoto_energy_ihf6200_grid_energy
    cycle: monthly
    periodically_resetting: false
  samoto_energy_ihf6200_grid_yearly:
    unique_id: samoto_energy_ihf6200_grid_yearly
    source: sensor.samoto_energy_ihf6200_grid_energy
    cycle: yearly
    periodically_resetting: false
  samoto_energy_ihf6200_load_daily:
    unique_id: samoto_energy_ihf6200_load_daily
    source: sensor.samoto_energy_ihf6200_load_energy
    cycle: daily
    periodically_resetting: false
  samoto_energy_ihf6200_load_monthly:
    unique_id: samoto_energy_ihf6200_load_monthly
    source: sensor.samoto_energy_ihf6200_load_energy
    cycle: monthly
    periodically_resetting: false
  samoto_energy_ihf6200_load_yearly:
    unique_id: samoto_energy_ihf6200_load_yearly
    source: sensor.samoto_energy_ihf6200_load_energy
    cycle: yearly
    periodically_resetting: false
  samoto_energy_ihf6200_pv_daily:
    unique_id: samoto_energy_ihf6200_pv_daily
    source: sensor.samoto_energy_ihf6200_pv_energy
    cycle: daily
    periodically_resetting: false
  samoto_energy_ihf6200_pv_monthly:
    unique_id: samoto_energy_ihf6200_pv_monthly
    source: sensor.samoto_energy_ihf6200_pv_energy
    cycle: monthly
    periodically_resetting: false
  samoto_energy_ihf6200_pv_yearly:
    unique_id: samoto_energy_ihf6200_pv_yearly
    source: sensor.samoto_energy_ihf6200_pv_energy
    cycle: yearly
    periodically_resetting: false
