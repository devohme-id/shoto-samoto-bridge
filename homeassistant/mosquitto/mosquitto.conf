# =============================================================================
# Konfigurasi Mosquitto MQTT Broker — Khusus LAN Lokal (Opsi B Docker)
# =============================================================================
# JANGAN PERNAH port-forward port 1883 ke internet di router ISP!
# Port ini hanya dipakai komunikasi lokal antara ESP32 Bridge dan Mini PC.
#
# Sebelum menjalankan Docker Compose, buat file password `homeassistant/mosquitto/passwd`:
#   touch homeassistant/mosquitto/passwd
#   docker run --rm -v "$PWD/homeassistant/mosquitto:/mosquitto/config" \
#     eclipse-mosquitto:2 mosquitto_passwd -b /mosquitto/config/passwd shoto_bridge <PASSWORD_KUAT>

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
