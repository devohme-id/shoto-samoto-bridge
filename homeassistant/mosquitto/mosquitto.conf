# =============================================================================
# Konfigurasi Mosquitto MQTT Broker — Khusus LAN Lokal (Opsi B Docker)
# =============================================================================
# JANGAN PERNAH port-forward port 1883 ke internet di router ISP!
# Port ini hanya dipakai komunikasi lokal antara ESP32 Bridge dan Mini PC.
#
# Sebelum menjalankan Docker Compose, buat file password `mosquitto/passwd` dari folder `homeassistant/`
# dengan UID/GID 1883 (`mosquitto` user di dalam container) agar mount `:ro` terbaca tanpa permission denied:
#   cd homeassistant
#   touch mosquitto/passwd && chmod 0600 mosquitto/passwd
#   docker run --rm --user 1883:1883 -v "$PWD/mosquitto/passwd:/mosquitto/passwd" \
#     eclipse-mosquitto:2 mosquitto_passwd -b /mosquitto/passwd shoto_bridge GANTI_PASSWORD_MQTT
# (Jika terlanjur dibuat sebagai root, jalankan: `sudo chown 1883:1883 mosquitto/passwd && chmod 0640 mosquitto/passwd`.)

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
