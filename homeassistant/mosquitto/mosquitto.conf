# =============================================================================
# Konfigurasi Mosquitto MQTT Broker — Khusus LAN Lokal (Opsi B Docker)
# =============================================================================
# JANGAN PERNAH port-forward port 1883 ke internet di router ISP!
# Port ini hanya dipakai komunikasi lokal antara ESP32 Bridge dan Mini PC.
#
# Sebelum menjalankan Docker Compose, buat file password `mosquitto/passwd` dari folder `homeassistant/`
# dengan ownership UID/GID 1883 (`mosquitto` user di dalam container) agar mount `:ro` terbaca tanpa permission denied:
#   cd homeassistant
#   docker run --rm -v "$PWD/mosquitto:/mosquitto/config" eclipse-mosquitto:2 \
#     sh -c "mosquitto_passwd -b -c /mosquitto/config/passwd shoto_bridge GANTI_PASSWORD_MQTT && chown 1883:1883 /mosquitto/config/passwd && chmod 0600 /mosquitto/config/passwd"

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
